<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Murli Bubble Builder</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    --color-text-primary: #1d1d1f; 
    --color-text-secondary: #515154;
    --color-text-tertiary: #86868b;
    --color-accent: #007aff; 
    --color-success: #34c759; 
    --color-error: #ff3b30; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    background-color: #f2f2f7;
    background-image: 
      radial-gradient(circle at 15% 10%, #dcd3ff 0%, transparent 40%),
      radial-gradient(circle at 85% 20%, #c4e0ff 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, #ffd1e8 0%, transparent 40%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent; 
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 15px;
  }

  #app { width: 100%; max-width: 600px; }

  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 24px;
    padding: 24px 20px;
  }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .lbl { font-size: 14px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .scr { font-size: 16px; font-weight: 700; color: var(--color-text-primary); }

  .prog-bg { height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--color-accent); transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); }

  .question-text {
    font-size: 18px; font-weight: 600; color: var(--color-text-primary);
    line-height: 1.5; margin-bottom: 24px; text-align: center; min-height: 54px;
  }

  .answer-area {
    min-height: 70px; background: rgba(255, 255, 255, 0.4);
    border: 2px dashed rgba(0,0,0,0.15); border-radius: 20px;
    display: flex; flex-wrap: wrap; gap: 10px; padding: 12px;
    margin-bottom: 30px; justify-content: center; align-items: center;
  }

  .bubble-pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 120px; }

  .bubble {
    background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.1);
    border-radius: 20px; padding: 12px 18px; font-size: 16px; font-weight: 500;
    color: var(--color-text-primary); cursor: pointer; user-select: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.1s;
  }

  .bubble:active { transform: scale(0.95); }
  .answer-area .bubble { background: var(--color-accent); color: white; border-color: var(--color-accent); }

  .bubble-correct { background-color: var(--color-success) !important; border-color: var(--color-success) !important; color: white !important; }
  .bubble-wrong { background-color: var(--color-error) !important; border-color: var(--color-error) !important; color: white !important; }

  .error-shake { animation: shake 0.4s both; }

  @keyframes shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  .hidden { visibility: hidden; opacity: 0; pointer-events: none; position: absolute; }
  .locked { pointer-events: none; }

  .final-score { font-size: 56px; font-weight: 700; color: var(--color-text-primary); margin: 10px 0; }
  .btn-primary { 
    padding: 16px 24px; font-size: 16px; font-weight: 600; border-radius: 24px; 
    cursor: pointer; background: var(--color-accent); color: white; border: none; 
    width: 100%; transition: transform 0.2s; 
  }

  .lb-container { text-align: left; margin-top: 20px; background: rgba(255,255,255,0.4); border-radius: 20px; padding: 20px; max-height: 350px; overflow-y: auto; }
  .lb-title { font-size: 16px; margin-bottom: 15px; text-align: center; font-weight: 700; }
  .lb-item { margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 8px; }
  .lb-name { font-weight: 600; font-size: 15px; }
  .lb-date { color: var(--color-text-tertiary); font-size: 12px; }
  .lb-score { font-weight: 700; color: var(--color-accent); font-size: 15px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ==========================================
// 1. FIREBASE SETUP
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDqoqpUFUkShdXMy21MEWhKsHKFlQUyNPo",
  authDomain: "murliquizleaderboard.firebaseapp.com",
  projectId: "murliquizleaderboard",
  storageBucket: "murliquizleaderboard.firebasestorage.app",
  messagingSenderId: "22978189390",
  appId: "1:22978189390:web:3b8cc0e44d12e181288b1f",
  measurementId: "G-7SEZBTTKZR"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. GAME DATA - 10 Questions from Murali (30-04-2026)
const questions = [
  { 
    q: "இது அதிசயமான _________ ஆகும், இங்கு சீர்கெட்டவர்களை சீராக்கக் கூடிய _________ தந்தை ஆசிரியராகி கற்பிக்கின்றார்.", 
    correctOrder: ["பல்கலைக்கழகமாகும்", "கள்ளங்கபடமற்ற"], 
    options: ["பல்கலைக்கழகமாகும்", "கள்ளங்கபடமற்ற", "பள்ளிக்கூடமாகும்", "அன்பான", "ஆசிரமமாகும்", "உயர்ந்த"] 
  },
  { 
    q: "அனைவருக்கும் ___________ கொடுக்கும் வள்ளல் ஒரே ஒரு தந்தை ஆவார். அவரைத் தான் _________________ என்று கூறுகிறோம்.", 
    correctOrder: ["சத்கதி", "கள்ளங்கபடமற்றவர்"], 
    options: ["சத்கதி", "முக்தி", "கள்ளங்கபடமற்றவர்", "ஞானக்கடல்", "சுகத்தை", "சத்குரு"] 
  },
  { 
    q: "ஆத்மா _________ மாறுவது கிடையாது, ஆத்மாவாகிய எனக்கு _________ என்ற ஒரே ஒரு பெயர் தான் இருக்கிறது.", 
    correctOrder: ["பெயர்", "சிவன்"], 
    options: ["பெயர்", "சிவன்", "கள்ளங்கபடமற்றவர்", "சத்குரு", "குணம்", "ஞானக்கடல்"] 
  },
  { 
    q: "சீர்கெட்டவர்களை சீராக்கக் கூடியவர் _________ , அவருக்குத்தான் மகிமை தவிர _________ கிடையாது.", 
    correctOrder: ["சிவன்", "சங்கருக்கு"], 
    options: ["சிவன்", "சங்கருக்கு", "விஷ்ணு", "பிரம்மாவுக்கு", "கிருஷ்ணன்", "இராமனுக்கு"] 
  },
  { 
    q: "சத்யுகம் _________ உலகம் என்று கூறப்படுகிறது, அங்கு நாம் இல்லற மார்கத்தைச் சார்ந்த _________ இருந்தோம்.", 
    correctOrder: ["விகாரமற்ற", "தேவி தேவதைகளாக"], 
    options: ["விகாரமற்ற", "தேவி தேவதைகளாக", "விகார", "மனிதர்களாக", "துக்க", "பக்தர்களாக"] 
  },
  { 
    q: "ஆரம்பத்தில் வரும் ஆத்மாக்கள் _________ ஆக இருப்பதால் எந்த _________ அனுபவிக்காது.", 
    correctOrder: ["சதோபிரதானமாக", "துக்கமும்"], 
    options: ["சதோபிரதானமாக", "துக்கமும்", "தமோபிரதானமாக", "சுகமும்", "சாதாரணமாக", "தண்டனையும்"] 
  },
  { 
    q: "இப்பொழுது நீங்கள் _________ செல்வதால் உங்களது முகம் அந்த பக்கம் இருக்கிறது, கால்கள் _________ பக்கம் இருக்க வேண்டும்.", 
    correctOrder: ["சொர்க்கத்திற்கு", "துக்கதாமத்தின்"], 
    options: ["சொர்க்கத்திற்கு", "துக்கதாமத்தின்", "வீட்டிற்கு", "சாந்திதாமத்தின்", "சுடுகாடு", "தெற்கு"] 
  },
  { 
    q: "நினைவின் மூலம் தான் _________ அழியும், இதில் தான் _________ இருக்கிறது.", 
    correctOrder: ["பாவங்கள்", "உழைப்பு"], 
    options: ["பாவங்கள்", "உழைப்பு", "தடைகள்", "மகிழ்ச்சி", "நோய்கள்", "பதவி"] 
  },
  { 
    q: "ஈஸ்வரிய குடும்பத்தின் நினைவின் மூலமாக _________ எதிர்கொள்ளக்கூடிய சதா _________ ஆகுக.", 
    correctOrder: ["மாயையை", "சக்தி சொரூபம்"], 
    options: ["மாயையை", "சக்தி சொரூபம்", "துக்கத்தை", "அமைதி சொரூபம்", "பகையை", "ஞான சொரூபம்"] 
  },
  { 
    q: "நாம் __________________ சேர்ந்தவர்கள் என்ற இந்த நினைவினுடைய ________________ அனைத்து பலவீனங்களையும் முடிவுக்குக் கொண்டு வரும்.", 
    correctOrder: ["ஈஸ்வரிய குடும்பத்தை", "ஆசனம்"], 
    options: ["ஈஸ்வரிய குடும்பத்தை", "சங்கமயுகத்தை", "ஆதாரம்", "பிராமண வம்சத்தை", "ஆசனம்", "தேவதா வம்சத்தை"] 
  }
];

let currentLevel = 0, score = 0, selectedBubbles = [], startTime = null;
const appDiv = document.getElementById('app');

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function initGame() {
  currentLevel = 0; score = 0; startTime = Date.now();
  appDiv.innerHTML = `
    <div class="glass-card">
      <div class="topbar">
        <span class="lbl" id="q-lbl">Q 1 / ${questions.length}</span>
        <span class="scr">Score: <span id="s-lbl">0</span></span>
      </div>
      <div class="prog-bg"><div class="prog-fill" id="prog-bar" style="width:0%"></div></div>
      <div class="question-text" id="question">Loading...</div>
      <div class="answer-area" id="answer-area"></div>
      <div class="bubble-pool" id="bubble-pool"></div>
    </div>`;
  loadLevel();
}

function loadLevel() {
  if (currentLevel >= questions.length) { endGame(); return; }
  const levelData = questions[currentLevel];
  document.getElementById('q-lbl').innerText = `Q ${currentLevel + 1} / ${questions.length}`;
  document.getElementById('s-lbl').innerText = score;
  document.getElementById('prog-bar').style.width = `${(currentLevel / questions.length) * 100}%`;
  
  const questionEl = document.getElementById('question'), poolArea = document.getElementById('bubble-pool'), answerArea = document.getElementById('answer-area');
  questionEl.innerHTML = levelData.q; 
  answerArea.innerHTML = ''; 
  poolArea.innerHTML = ''; 
  selectedBubbles = [];
  answerArea.classList.remove('error-shake', 'locked'); 
  poolArea.classList.remove('locked');

  shuffle([...levelData.options]).forEach((word) => {
    const btn = document.createElement('div'); btn.className = 'bubble'; btn.innerText = word;
    btn.onclick = () => moveToAnswer(btn, word);
    poolArea.appendChild(btn);
  });
}

function moveToAnswer(btnElement, word) {
  btnElement.classList.add('hidden'); 
  selectedBubbles.push(word);
  
  const answerArea = document.getElementById('answer-area');
  const clone = document.createElement('div'); 
  clone.className = 'bubble'; 
  clone.innerText = word;
  
  clone.onclick = () => {
    if(!answerArea.classList.contains('locked')) {
        clone.remove(); btnElement.classList.remove('hidden');
        selectedBubbles = selectedBubbles.filter(w => w !== word);
    }
  };
  
  answerArea.appendChild(clone);
  
  if (selectedBubbles.length === questions[currentLevel].correctOrder.length) {
    checkAnswer();
  }
}

function checkAnswer() {
  const answerArea = document.getElementById('answer-area');
  const poolArea = document.getElementById('bubble-pool');
  const questionEl = document.getElementById('question');
  const levelData = questions[currentLevel];
  
  poolArea.classList.add('locked'); 
  answerArea.classList.add('locked');
  
  const placedBubbles = answerArea.querySelectorAll('.bubble');
  let isPerfect = true;

  selectedBubbles.forEach((val, index) => {
    if (val === levelData.correctOrder[index]) {
        placedBubbles[index].classList.add('bubble-correct');
    } else {
        placedBubbles[index].classList.add('bubble-wrong');
        isPerfect = false;
    }
  });

  const feedbackHtml = isPerfect 
    ? `<div style="color: var(--color-success); margin-top: 10px; font-weight: 700;">✓ Perfect!</div>` 
    : `<div style="color: var(--color-error); margin-top: 10px; font-weight: 700;">✗ Incorrect</div>`;

  if (isPerfect) {
    score++;
    document.getElementById('s-lbl').innerText = score;
  } else {
    answerArea.classList.add('error-shake');
  }

  // Update question area with original text AND feedback
  questionEl.innerHTML = levelData.q + feedbackHtml;

  setTimeout(() => { 
    currentLevel++; 
    loadLevel(); 
  }, 2500);
}

function endGame() {
  const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
  const minutes = Math.floor(totalSeconds / 60), seconds = totalSeconds % 60;
  const timeTakenStr = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;

  appDiv.innerHTML = `<div class="glass-card" style="text-align:center;"><div class="question-text">Saving Score...</div></div>`;
  let playerName = prompt("Game Over! Enter your name:") || "Player";

  db.collection("leaderboard").add({
    name: playerName.substring(0, 20), score: score, timeTaken: timeTakenStr,
    durationSeconds: totalSeconds, timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    
    db.collection("leaderboard")
      .where("timestamp", ">=", today)
      .orderBy("timestamp", "desc")
      .get()
      .then((snapshot) => {
        let scoresArr = [];
        snapshot.forEach(doc => scoresArr.push(doc.data()));
        scoresArr.sort((a, b) => b.score - a.score || a.durationSeconds - b.durationSeconds);

        let boardHTML = `<div class="lb-container"><h3 class="lb-title">TODAY'S LEADERBOARD</h3><ol style="padding-left:0; list-style-position: inside; margin:0;">`;
        scoresArr.slice(0, 10).forEach((data) => {
          let timeDisplay = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
          boardHTML += `
            <li class="lb-item">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span><div class="lb-name">${data.name}</div><div class="lb-date">${timeDisplay} &bull; ⏱️ ${data.timeTaken}</div></span>
                <span class="lb-score">${data.score} pts</span>
              </div>
            </li>`;
        });
        boardHTML += `</ol></div>`;

        appDiv.innerHTML = `
          <div class="glass-card" style="text-align:center;">
            <div class="final-score">${score} <span style="font-size:32px; color:var(--color-text-tertiary)">/ ${questions.length}</span></div>
            <p style="margin-bottom:20px;">Time: <strong>${timeTakenStr}</strong></p>
            ${boardHTML}
            <button class="btn-primary" style="margin-top:20px;" onclick="initGame()">Play Again</button>
            <button class="btn-primary" style="margin-top:12px; background:#5856d6;" onclick="showWeeklyTop5()">View Weekly Toppers</button>
          </div>`;
      });
  }).catch(() => {
    appDiv.innerHTML = `<div class="glass-card" style="text-align:center;"><h2>Connection Error</h2><button class="btn-primary" onclick="initGame()">Try Again</button></div>`;
  });
}

async function showWeeklyTop5() {
  appDiv.innerHTML = `<div class="glass-card" style="text-align:center;"><div class="question-text">Calculating Weekly Report...</div></div>`;
  
  const now = new Date();
  const diff = (now.getDay() === 0 ? 6 : now.getDay() - 1);
  const curMon = new Date(now); curMon.setDate(now.getDate() - diff); curMon.setHours(0,0,0,0);
  
  const start = new Date(curMon); start.setDate(curMon.getDate() - 7);
  const end = new Date(curMon); end.setMilliseconds(-1);

  try {
    const snap = await db.collection("leaderboard")
      .where("timestamp", ">=", start)
      .where("timestamp", "<=", end)
      .get();

    const totals = {};
    snap.forEach(doc => {
      const d = doc.data();
      let n = (d.name || "").trim();
      let lower = n.toLowerCase();
      if (lower === "player" || lower === "testrun" || n.length <= 1) return;
      totals[n] = (totals[n] || 0) + d.score;
    });

    const top5 = Object.keys(totals).map(n => ({ n, s: totals[n] }))
      .sort((a,b) => b.s - a.s)
      .slice(0, 5);

    const dateStr = `${start.toLocaleDateString(undefined, {month:'short', day:'numeric'})} - ${end.toLocaleDateString(undefined, {month:'short', day:'numeric'})}`;

    let listHtml = top5.map((item, i) => `
      <div class="lb-item">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>#${i+1} <span class="lb-name" style="display:inline;">${item.n}</span></span>
          <span class="lb-score">${item.s} pts</span>
        </div>
      </div>`).join('') || "<p style='padding:20px;'>No toppers found for last week.</p>";

    appDiv.innerHTML = `
      <div class="glass-card" style="text-align:center;">
        <h2 style="margin-bottom:5px;">Weekly Toppers</h2>
        <div style="font-size:12px; color:var(--color-text-tertiary); margin-bottom:15px;">Last Week: ${dateStr}</div>
        <div class="lb-container">
          ${listHtml}
        </div>
        <button class="btn-primary" style="margin-top:24px;" onclick="initGame()">Back to Home</button>
      </div>`;
  } catch (e) {
    appDiv.innerHTML = `<div class="glass-card" style="text-align:center;"><h2>Error loading data</h2><button class="btn-primary" onclick="initGame()">Back</button></div>`;
  }
}

initGame();
</script>
</body>
</html>
