<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Murli Bubble Builder</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    --color-text-primary: #1d1d1f; 
    --color-text-secondary: #515154;
    --color-accent: #007aff; 
    --color-success: #34c759; 
    --color-error: #ff3b30; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { 
    background-color: #f2f2f7;
    background-image: 
      radial-gradient(circle at 15% 10%, #dcd3ff 0%, transparent 40%),
      radial-gradient(circle at 85% 20%, #c4e0ff 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, #ffd1e8 0%, transparent 40%);
    background-attachment: fixed;
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 15px;
  }

  #app { width: 100%; max-width: 600px; position: relative; }

  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 24px;
    padding: 24px 20px;
    text-align: center;
  }

  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center; z-index: 1000;
  }

  .input-field {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);
    margin-bottom: 20px; font-size: 16px; outline: none; text-align: center;
  }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .lbl { font-size: 14px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; }
  .prog-bg { height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; margin-bottom: 24px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--color-accent); transition: width 0.4s; }
  .question-text { font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 24px; min-height: 54px; }
  .answer-area { 
    min-height: 70px; background: rgba(255, 255, 255, 0.4); border: 2px dashed rgba(0,0,0,0.15); 
    border-radius: 20px; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; margin-bottom: 30px; justify-content: center; 
  }
  .bubble-pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .bubble { 
    background: white; border-radius: 20px; padding: 12px 18px; font-size: 16px; 
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.1s;
  }
  .answer-area .bubble { background: var(--color-accent); color: white; }
  .bubble-correct { background: var(--color-success) !important; color: white; }
  .bubble-wrong { background: var(--color-error) !important; color: white; }
  
  .hidden { display: none; }
  .locked { pointer-events: none; }
  
  .btn-primary { 
    padding: 16px 24px; font-size: 16px; font-weight: 600; border-radius: 24px; 
    background: var(--color-accent); color: white; border: none; width: 100%; cursor: pointer;
  }
  .lb-container { text-align: left; margin-top: 20px; background: rgba(255,255,255,0.4); border-radius: 20px; padding: 15px; }
  .lb-item { margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 8px; }
  .lb-name { font-weight: 600; font-size: 15px; }
  .lb-score { font-weight: 700; color: var(--color-accent); font-size: 15px; }
</style>
</head>
<body>

<div id="app">
    <div id="name-modal" class="overlay">
        <div class="glass-card" style="width: 90%; max-width: 400px;">
            <h2 style="margin-bottom:15px;">Welcome</h2>
            <p style="margin-bottom:20px; color:var(--color-text-secondary);">Enter your name to start the daily Murli quiz.</p>
            <input type="text" id="player-name-input" class="input-field" placeholder="Your Name">
            <button class="btn-primary" onclick="startWithValidation()">Start Quiz</button>
        </div>
    </div>

    <div id="game-container" class="hidden"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqoqpUFUkShdXMy21MEWhKsHKFlQUyNPo",
  authDomain: "murliquizleaderboard.firebaseapp.com",
  projectId: "murliquizleaderboard",
  storageBucket: "murliquizleaderboard.firebasestorage.app",
  messagingSenderId: "22978189390",
  appId: "1:22978189390:web:3b8cc0e44d12e181288b1f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 1. GAME DATA - 10 Questions from Murali (18-05-2026)
const questions = [
  { 
    q: "நாம் ஈஸ்வரிய குடும்பத்தினர் - நாம் நமது _________ தெய்வீக _________ ஸ்திபனை செய்து கொண்டிருக்கிறோம் என்ற ஆன்மீக போதையில் இருங்கள்.", 
    correctOrder: ["மறைமுகமான", "இராஜாங்கத்தை"], 
    options: ["மறைமுகமான", "இராஜாங்கத்தை", "ஸ்தூலமான", "ஆசிரமத்தை", "புதிய", "கோயிலை"] 
  },
  { 
    q: "உண்மையில் இது எல்லையில்லாத தந்தையின் குடும்பமாகும். ஈஸ்வரிய _______________. இவர்களுக்காக விநாச காலத்தில் _______ புத்தி உடையவர்களே வெற்றி அடைவோர்! என்று பாடப்படுகிறது. இப்பேர்ப்பட்ட குடும்பம் ஒரு பொழுதும் கீதையில் பாடப்படவில்லை.", 
    correctOrder: ["விஷ்வவித்தியாலயம்", "அன்பான"], 
    options: ["விஷ்வவித்தியாலயம்", "நிச்சய", "அன்பான", "குடும்பம்", "சேனை", "அசையாத"] 
  },
  { 
    q: "கலியுகத்தில் அசுர குடும்பம், சத்யுகத்தில் தெய்வீக குடும்பம், ஆனால் இந்த சங்கமத்தில் உங்களுடையது _________ _________ ஆகும்.", 
    correctOrder: ["ஈஸ்வரிய", "குடும்பம்"], 
    options: ["ஈஸ்வரிய", "குடும்பம்", "மனித", "சாதாரண", "பழைய", "அழுக்கான"] 
  },
  { 
    q: "இச்சமயத்தில் நீங்கள் _________ _________ ஆக உள்ளீர்கள், ஏனெனில் ஆத்மா ஞானம் நிறைந்து இருக்கிறது, வாழ்வோ யோகமயமாக உள்ளது.", 
    correctOrder: ["ரூப்", "பஸந்த்"], 
    options: ["ரூப்", "பஸந்த்", "ஞான", "யோகி", "பூஜாரி", "தேவதை"] 
  },
  { 
    q: "84 பிறவிகளின் சக்கரம் சுற்றி வந்துள்ள பிரஜாபிதா பிரம்மா இந்த மனித சிருஷ்டியின் கிரேட் கிரேட் _________ _________ ஆகிறார்.", 
    correctOrder: ["கிராண்டு", "ஃபாதர்"], 
    options: ["கிராண்டு", "ஃபாதர்", "மதர்", "டீச்சர்", "குரு", "அரசன்"] 
  },
  { 
    q: "சாட்சாத்காரங்கள் மற்றும் காட்சிகள் ஆகியவற்றில் _________ பிரவேசம் நிறைய ஆகிறது, இவை எல்லாமே _________ பிரவேசம் ஆகும்.", 
    correctOrder: ["மாயையின்", "பூதங்களின்"], 
    options: ["மாயையின்", "பூதங்களின்", "சிவனின்", "தேவர்களின்", "ஆத்மாவின்", "அன்பின்"] 
  },
  { 
    q: "சத்யுகத்தில் ___ தந்தை, சங்கமத்தில் ___ தந்தையர் ஆவார்கள்.", 
    correctOrder: ["1", "3"], 
    options: ["3", "2", "4", "1"] 
  },
  { 
    q: "_________ மட்டும் நினைவு செய்வதல்ல. தந்தையின் நினைவினால் தான் ___________ விநாசம் ஆகும்.", 
    correctOrder: ["சாந்தி தாமத்தை", "விகர்மங்கள்"], 
    options: ["சாந்தி தாமத்தை", "பிரம்மாவை", "விகர்மங்கள்", "தேவர்களை", "ஆத்மாவை", "பாவங்கள்"] 
  },
  { 
    q: "ஒவ்வொரு விஷயத்திலும் _________ கிரஹித்துக் கொண்டு ஆல்ரவுண்ட் ஆகக்கூடிய _________ புருஷார்த்தி ஆகுக.", 
    correctOrder: ["சாரத்தைக்", "சரள"], 
    options: ["சாரத்தைக்", "சரள", "சக்தியை", "தீவிர", "சாந்தியை", "பறக்கும்"] 
  },
  { 
    q: "ஒரே இரசனை (ஏக்ரஸ்) நிலை உருவாக்கும் போது எந்தவொரு காட்சியைப் பார்க்கும்போதும் _________ ? _________ ? என்ற கேள்விகள் வராது.", 
    correctOrder: ["ஏன்", "எப்படி"], 
    options: ["ஏன்", "எப்படி", "யார்", "எங்கு", "என்ன", "எதற்கு"] 
  }
];

let currentLevel = 0, score = 0, selectedBubbles = [], startTime = null, playerName = "", currentDocId = null;

async function startWithValidation() {
    const input = document.getElementById('player-name-input');
    playerName = input.value.trim();
    if (playerName.length < 2) return alert("Please enter a valid name");

    document.getElementById('name-modal').classList.add('hidden');
    document.getElementById('game-container').classList.remove('hidden');
    
    const entry = await db.collection("leaderboard").add({
        name: playerName,
        score: 0,
        status: "started",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    currentDocId = entry.id;
    initGame();
}

function initGame() {
    currentLevel = 0; score = 0; startTime = Date.now();
    document.getElementById('game-container').innerHTML = `
        <div class="glass-card">
            <div class="topbar">
                <span class="lbl" id="q-lbl">Q 1 / ${questions.length}</span>
                <span class="scr">Score: <span id="s-lbl">0</span></span>
            </div>
            <div class="prog-bg"><div class="prog-fill" id="prog-bar" style="width:0%"></div></div>
            <div id="question" class="question-text"></div>
            <div id="answer-area" class="answer-area"></div>
            <div id="bubble-pool" class="bubble-pool"></div>
        </div>`;
    loadLevel();
}

function loadLevel() {
    if (currentLevel >= questions.length) { finishGame(); return; }
    const data = questions[currentLevel];
    document.getElementById('q-lbl').innerText = `Q ${currentLevel + 1} / ${questions.length}`;
    document.getElementById('prog-bar').style.width = `${(currentLevel / questions.length) * 100}%`;
    
    const pool = document.getElementById('bubble-pool'), ans = document.getElementById('answer-area');
    document.getElementById('question').innerHTML = data.q;
    ans.innerHTML = ''; pool.innerHTML = ''; ans.classList.remove('locked');
    selectedBubbles = [];

    [...data.options].sort(() => Math.random() - 0.5).forEach(word => {
        const b = document.createElement('div'); b.className = 'bubble'; b.innerText = word;
        b.onclick = () => {
            b.classList.add('hidden');
            selectedBubbles.push(word);
            const clone = document.createElement('div'); clone.className = 'bubble'; clone.innerText = word;
            clone.onclick = () => { if(!ans.classList.contains('locked')) { clone.remove(); b.classList.remove('hidden'); selectedBubbles = selectedBubbles.filter(w => w !== word); } };
            ans.appendChild(clone);
            if (selectedBubbles.length === data.correctOrder.length) checkAnswer();
        };
        pool.appendChild(b);
    });
}

function checkAnswer() {
    const ansArea = document.getElementById('answer-area');
    ansArea.classList.add('locked');
    const correct = questions[currentLevel].correctOrder;
    let isCorrect = selectedBubbles.every((val, i) => val === correct[i]);

    const items = ansArea.querySelectorAll('.bubble');
    selectedBubbles.forEach((val, i) => items[i].classList.add(val === correct[i] ? 'bubble-correct' : 'bubble-wrong'));

    if (isCorrect) {
        score++;
        document.getElementById('s-lbl').innerText = score;
        db.collection("leaderboard").doc(currentDocId).update({ score: score });
    }
    setTimeout(() => { currentLevel++; loadLevel(); }, 1500);
}

function finishGame() {
    const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
    db.collection("leaderboard").doc(currentDocId).update({
        status: "completed",
        durationSeconds: totalSeconds,
        timeTaken: `${Math.floor(totalSeconds/60)}m ${totalSeconds%60}s`
    }).then(showLeaderboard);
}

function showLeaderboard() {
    const today = new Date(); today.setHours(0,0,0,0);
    db.collection("leaderboard").where("timestamp", ">=", today).orderBy("timestamp", "desc").get().then(snap => {
        let scores = [];
        snap.forEach(doc => scores.push(doc.data()));
        scores.sort((a,b) => b.score - a.score);

        let list = scores.slice(0, 10).map(s => `
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(0,0,0,0.05);">
                <span><b>${s.name}</b><br><small>${s.status === 'completed' ? 'Finished' : 'Incomplete'}</small></span>
                <span style="color:var(--color-accent); font-weight:700;">${s.score} pts</span>
            </div>`).join('');

        document.getElementById('game-container').innerHTML = `
            <div class="glass-card">
                <h1>Quiz Over!</h1>
                <div style="font-size:48px; margin:20px 0;">${score} / ${questions.length}</div>
                <div class="lb-container">
                    <h4 style="text-align:center; margin-bottom:10px;">TODAY'S ACTIVITY</h4>
                    ${list}
                </div>
                <button class="btn-primary" style="margin-top:20px;" onclick="location.reload()">Play Again</button>
                <button class="btn-primary" style="margin-top:12px; background:#5856d6;" onclick="showWeeklyTop5()">View Weekly Toppers</button>
            </div>`;
    });
}

// UPDATED WEEKLY TOP 5 LOGIC
async function showWeeklyTop5() {
  const container = document.getElementById('game-container');
  container.innerHTML = `
    <div class="glass-card" style="text-align:center;">
      <div class="question-text">
        Calculating Weekly Report...
      </div>
    </div>
  `;

  const now = new Date();
  const diff = (now.getDay() === 0 ? 6 : now.getDay() - 1);
  const curMon = new Date(now);
  curMon.setDate(now.getDate() - diff);
  curMon.setHours(0,0,0,0);

  const start = new Date(curMon);
  start.setDate(curMon.getDate() - 7);
  const end = new Date(curMon);
  end.setMilliseconds(-1);

  try {
    const snap = await db
      .collection("leaderboard")
      .where("timestamp", ">=", start)
      .where("timestamp", "<=", end)
      .get();

    const docs = [];
    snap.forEach(doc => {
      docs.push(doc.data());
    });

    // Sort by earliest timestamp
    docs.sort((a, b) => {
      const ta = a.timestamp?.toDate()?.getTime() || 0;
      const tb = b.timestamp?.toDate()?.getTime() || 0;
      return ta - tb;
    });

    // First attempt per user per day
    const firstAttempts = {};
    docs.forEach(d => {
      let n = (d.name || "").trim();
      let lower = n.toLowerCase();

      if (
        lower === "player" ||
        lower === "testrun" ||
        n.length <= 1
      ) return;

      const ts = d.timestamp?.toDate();
      if (!ts) return;

      const dayKey = ts.getFullYear() + "-" + (ts.getMonth() + 1) + "-" + ts.getDate();
      const uniqueKey = `${lower}_${dayKey}`;

      // Save ONLY first attempt
      if (!firstAttempts[uniqueKey]) {
        firstAttempts[uniqueKey] = {
          name: n,
          score: d.score || 0
        };
      }
    });

    // Weekly totals
    const totals = {};
    Object.values(firstAttempts).forEach(entry => {
      totals[entry.name] = (totals[entry.name] || 0) + entry.score;
    });

    // Top 5
    const top5 = Object.keys(totals)
      .map(n => ({ n, s: totals[n] }))
      .sort((a,b) => b.s - a.s)
      .slice(0,5);

    const dateStr = `${start.toLocaleDateString(undefined, {
      month: 'short',
      day: 'numeric'
    })} - ${end.toLocaleDateString(undefined, {
      month: 'short',
      day: 'numeric'
    })}`;

    let listHtml = top5.map((item, i) => `
      <div class="lb-item">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span>
            #${i+1}
            <span class="lb-name" style="display:inline;">${item.n}</span>
          </span>
          <span class="lb-score">${item.s} pts</span>
        </div>
      </div>
    `).join('');

    if (!listHtml) {
      listHtml = `
        <p style="padding:20px;">
          No toppers found for last week.
        </p>
      `;
    }

    container.innerHTML = `
      <div class="glass-card" style="text-align:center;">
        <h2 style="margin-bottom:5px;">Weekly Toppers</h2>
        <div style="font-size:12px; color:var(--color-text-secondary); margin-bottom:15px;">
          Last Week: ${dateStr}
        </div>
        <div class="lb-container">
          ${listHtml}
        </div>
        <button class="btn-primary" style="margin-top:24px;" onclick="location.reload()">
          Back to Home
        </button>
      </div>
    `;

  } catch (e) {
    console.error(e);
    container.innerHTML = `
      <div class="glass-card" style="text-align:center;">
        <h2>Error loading data</h2>
        <button class="btn-primary" onclick="location.reload()">Back</button>
      </div>
    `;
  }
}
</script>
</body>
</html>
